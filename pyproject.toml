[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-assistant"
version = "0.1.0"
description = "LLM-Powered API Test Generation & Evaluation Pipeline with TF-IDF Retrieval, Anti-Hallucination Guardrails, and AST Safety Scanning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Pranav Mahana", email = "pranavmahana@users.noreply.github.com" }
]
keywords = [
    "api-testing",
    "openapi",
    "swagger",
    "pytest",
    "llm",
    "claude",
    "test-generation",
    "ast-analysis",
    "tf-idf",
    "prompt-injection",
    "red-teaming"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "anthropic>=0.18.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "httpx>=0.25.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]

[project.scripts]
ai-test-assistant = "ai_test_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_test_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
