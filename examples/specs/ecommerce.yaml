openapi: 3.0.3
info:
  title: E-Commerce Store API
  version: 2.1.0
  description: High-volume e-commerce store orders and product management service.
servers:
  - url: https://api.mystore.com/v2

security:
  - BearerAuth: []

paths:
  /products:
    get:
      summary: Search catalog products
      operationId: getProducts
      tags:
        - catalog
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: min_price
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: List of products matching filters
        "400":
          description: Invalid filter parameters

  /orders:
    post:
      summary: Place a new customer order
      operationId: createOrder
      tags:
        - orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - items
              properties:
                customer_id:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: string
                      quantity:
                        type: integer
      responses:
        "201":
          description: Order created successfully
        "400":
          description: Invalid order payload
        "401":
          description: Missing or invalid authentication token

  /orders/{orderId}:
    get:
      summary: Retrieve order status
      operationId: getOrderById
      tags:
        - orders
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order status details
        "404":
          description: Order not found
        "401":
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
