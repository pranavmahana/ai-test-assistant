name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Linter
        run: |
          ruff check ai_test_assistant tests examples

      - name: Run Offline Unit & Integration Tests
        run: |
          pytest --cov=ai_test_assistant --cov-report=term-missing --cov-report=xml tests/

      - name: Run Red-Team Prompt-Injection Benchmark
        run: |
          python -m ai_test_assistant redteam --spec examples/specs/adversarial_injection.yaml
